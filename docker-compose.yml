services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: aeromind
      POSTGRES_PASSWORD: aeromind123
      POSTGRES_DB: aeromind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://aeromind:aeromind123@db:5432/aeromind
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - ./ai:/app/ai

volumes:
  postgres_data:
